openapi: 3.0.0
info:
  title: In-App Purchase API
  version: 1.0.0
  description: Contracts for StoreKit 2 integration in 2244

paths:
  /iap/products:
    get:
      summary: Get available products
      operationId: getProducts
      responses:
        '200':
          description: List of available products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  restorable:
                    type: array
                    items:
                      type: string
                    description: Product IDs that can be restored

  /iap/purchase:
    post:
      summary: Initiate purchase
      operationId: purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
              properties:
                productId:
                  type: string
                  description: StoreKit product ID
      responses:
        '200':
          description: Purchase successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResult'
        '402':
          description: Payment required or failed
        '409':
          description: Product already purchased (for non-consumables)

  /iap/restore:
    post:
      summary: Restore purchases
      operationId: restorePurchases
      responses:
        '200':
          description: Restore completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '404':
          description: No purchases to restore

  /iap/verify:
    post:
      summary: Verify purchase receipt
      operationId: verifyPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transactionId
              properties:
                transactionId:
                  type: string
                productId:
                  type: string
      responses:
        '200':
          description: Purchase verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                    description: For subscriptions

  /iap/entitlements:
    get:
      summary: Get current entitlements
      operationId: getEntitlements
      responses:
        '200':
          description: Current entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - type
        - displayName
        - price
      properties:
        id:
          type: string
          description: StoreKit product ID
        type:
          $ref: '#/components/schemas/ProductType'
        displayName:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        priceLocale:
          type: string
          description: Locale-formatted price string
        isPurchased:
          type: boolean
        isAvailable:
          type: boolean

    ProductType:
      type: string
      enum:
        - theme        # Non-consumable
        - adFree       # Non-consumable
        - coinPack     # Consumable
        - gemPack      # Consumable

    PurchaseResult:
      type: object
      properties:
        success:
          type: boolean
        productId:
          type: string
        transactionId:
          type: string
        purchaseDate:
          type: string
          format: date-time
        rewards:
          $ref: '#/components/schemas/PurchaseRewards'
        error:
          type: string
          enum: [cancelled, failed, pending, unknown]

    PurchaseRewards:
      type: object
      properties:
        coins:
          type: integer
        gems:
          type: integer
        powerUps:
          type: object
          additionalProperties:
            type: integer
        themeUnlocked:
          $ref: '#/components/schemas/ThemeID'
        adFreeUnlocked:
          type: boolean

    RestoreResult:
      type: object
      properties:
        restoredCount:
          type: integer
        restoredProducts:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              transactionId:
                type: string
              purchaseDate:
                type: string
                format: date-time
        entitlements:
          $ref: '#/components/schemas/Entitlements'

    Entitlements:
      type: object
      properties:
        adFree:
          type: boolean
        premiumThemes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeID'
        lifetimeCoins:
          type: integer
          description: Total coins purchased
        lifetimeGems:
          type: integer
          description: Total gems purchased

    ThemeID:
      type: string
      enum: [classic, minimal, retro, cyberpunk, lofi, orchestral]

    ProductIdentifiers:
      type: object
      properties:
        themes:
          type: object
          properties:
            cyberpunk:
              type: string
              default: com.game2244.theme.cyberpunk
            lofi:
              type: string
              default: com.game2244.theme.lofi
            orchestral:
              type: string
              default: com.game2244.theme.orchestral
        adFree:
          type: string
          default: com.game2244.adfree
        coins:
          type: object
          properties:
            small:
              type: string
              default: com.game2244.coins.small
            medium:
              type: string
              default: com.game2244.coins.medium
            large:
              type: string
              default: com.game2244.coins.large
        gems:
          type: object
          properties:
            small:
              type: string
              default: com.game2244.gems.small
            medium:
              type: string
              default: com.game2244.gems.medium
            large:
              type: string
              default: com.game2244.gems.large